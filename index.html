<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Friendship Junction</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6c5ce7, #a855f7, #ec4899);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .logo {
      font-size: 45px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 18px;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(15px);
      padding: 30px 22px;
      border-radius: 25px;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 50px;
      background: white;
      color: #7c3aed;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-size: 15px;
      min-height: 22px;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🤝</div>

    <h1>Friendship Junction</h1>

    <p class="tagline">
      Meet someone new. Make a new friend.
    </p>

    <div class="card">

      <button id="startButton">
        🚀 Start Chat
      </button>

      <p id="status"></p>

    </div>

    <p class="footer">
      Meet • Chat • Connect
    </p>

  </div>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      set
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCjK69caLVFreSK40n3S-5OkWBQXMa_lyI",
      authDomain: "friendship-junction-549ff.firebaseapp.com",
      databaseURL: "https://friendship-junction-549ff-default-rtdb.firebaseio.com",
      projectId: "friendship-junction-549ff",
      storageBucket: "friendship-junction-549ff.firebasestorage.app",
      messagingSenderId: "641554247603",
      appId: "1:641554247603:web:69115118fe8bceb96265c6"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const button = document.getElementById("startButton");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {

      status.textContent = "Connecting... ⏳";
      button.disabled = true;

      const userId =
        "user_" + Math.random().toString(36).substring(2, 10);

      try {

        await set(ref(database, "test/" + userId), {
          online: true,
          createdAt: Date.now()
        });

        status.textContent = "Firebase connected! 🎉";

        button.textContent = "Connected ✓";

      } catch (error) {

        console.error(error);

        status.textContent =
          "Connection failed. Check Firebase Rules.";

        button.disabled = false;
      }

    });

  </script>

</body>
</html>
