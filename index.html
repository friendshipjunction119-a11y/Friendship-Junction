<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friendship Junction</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6c5ce7, #a855f7, #ec4899);
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      margin-top: 15px;
    }

    h1 {
      font-size: 34px;
      margin: 8px 0;
    }

    .subtitle {
      opacity: .85;
      margin-bottom: 20px;
    }

    .card {
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 25px;
      text-align: left;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .checkbox {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 18px 0;
      font-size: 14px;
      line-height: 1.4;
    }

    .checkbox input {
      width: auto;
      margin-top: 3px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #7c3aed;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #chatArea {
      display: none;
    }

    #status {
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .profile {
      background: rgba(255,255,255,.18);
      padding: 12px;
      border-radius: 15px;
      margin-bottom: 15px;
      text-align: center;
    }

    #messages {
      height: 330px;
      overflow-y: auto;
      background: rgba(0,0,0,.15);
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .message {
      background: rgba(255,255,255,.18);
      padding: 10px;
      border-radius: 14px;
      margin: 6px 0;
      word-wrap: break-word;
    }

    .mine {
      background: white;
      color: #6c5ce7;
      text-align: right;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
    }

    .input-row button {
      width: auto;
      padding: 12px 18px;
    }

    #nextButton {
      margin-top: 12px;
    }

    .error {
      color: #ffe1e1;
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">🤝</div>

  <h1>Friendship Junction</h1>

  <p class="subtitle">
    Meet someone new. Make a new friend.
  </p>

  <!-- PROFILE -->

  <div class="card" id="profileArea">

    <label>Your name</label>

    <input
      id="nameInput"
      type="text"
      maxlength="30"
      placeholder="Enter your name"
    >

    <label>Gender</label>

    <select id="genderInput">
      <option value="">Select gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <label>Age</label>

    <input
      id="ageInput"
      type="number"
      min="18"
      max="100"
      placeholder="18 or older"
    >

    <label class="checkbox">

      <input
        id="adultCheck"
        type="checkbox"
      >

      <span>
        I confirm that I am 18 years old or older.
      </span>

    </label>

    <button id="startButton">
      🚀 Start Chat
    </button>

    <p id="error" class="error"></p>

  </div>


  <!-- CHAT -->

  <div class="card" id="chatArea">

    <div id="status">
      Connecting...
    </div>

    <div class="profile" id="partnerProfile">
      👤 Waiting for a match...
    </div>

    <div id="messages"></div>

    <div class="input-row">

      <input
        id="messageInput"
        type="text"
        maxlength="500"
        placeholder="Type a message..."
      >

      <button id="sendButton">
        Send
      </button>

    </div>

    <button id="nextButton">
      ⏭️ Next Person
    </button>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  push,
  onValue,
  remove,
  onDisconnect
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

  apiKey: "AIzaSyCjK69caLVFreSK40n3S-5OkWBQXMa_lyI",

  authDomain:
    "friendship-junction-549ff.firebaseapp.com",

  databaseURL:
    "https://friendship-junction-549ff-default-rtdb.firebaseio.com",

  projectId:
    "friendship-junction-549ff",

  storageBucket:
    "friendship-junction-549ff.firebasestorage.app",

  messagingSenderId:
    "641554247603",

  appId:
    "1:641554247603:web:69115118fe8bceb96265c6"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


const userId =
  "user_" +
  Math.random().toString(36).substring(2, 10);


let roomId = null;
let myProfile = null;


const nameInput =
  document.getElementById("nameInput");

const genderInput =
  document.getElementById("genderInput");

const ageInput =
  document.getElementById("ageInput");

const adultCheck =
  document.getElementById("adultCheck");

const startButton =
  document.getElementById("startButton");

const profileArea =
  document.getElementById("profileArea");

const chatArea =
  document.getElementById("chatArea");

const status =
  document.getElementById("status");

const partnerProfile =
  document.getElementById("partnerProfile");

const messages =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const nextButton =
  document.getElementById("nextButton");

const error =
  document.getElementById("error");


startButton.addEventListener(
  "click",
  startMatching
);

sendButton.addEventListener(
  "click",
  sendMessage
);

nextButton.addEventListener(
  "click",
  nextPerson
);

messageInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      sendMessage();
    }

  }
);


/* PROFILE VALIDATION */

function getProfile() {

  const name =
    nameInput.value.trim();

  const gender =
    genderInput.value;

  const age =
    Number(ageInput.value);

  if (!name) {

    error.textContent =
      "Please enter your name.";

    return null;
  }

  if (!gender) {

    error.textContent =
      "Please select your gender.";

    return null;
  }

  if (!age || age < 18 || age > 100) {

    error.textContent =
      "You must be 18 or older.";

    return null;
  }

  if (!adultCheck.checked) {

    error.textContent =
      "You must confirm that you are 18+.";

    return null;
  }

  error.textContent = "";

  return {
    name,
    gender,
    age
  };

}


/* START MATCHING */

async function startMatching() {

  myProfile = getProfile();

  if (!myProfile) {
    return;
  }

  startButton.disabled = true;

  status.textContent =
    "🔎 Looking for someone...";

  profileArea.style.display =
    "none";

  chatArea.style.display =
    "block";


  await set(
    ref(db, "profiles/" + userId),
    myProfile
  );


  await set(
    ref(db, "waiting/" + userId),
    {
      joinedAt: Date.now()
    }
  );


  onDisconnect(
    ref(db, "waiting/" + userId)
  ).remove();


  const waitingSnapshot =
    await get(ref(db, "waiting"));


  let foundUser = null;


  waitingSnapshot.forEach(child => {

    if (
      child.key !== userId &&
      !foundUser
    ) {

      foundUser = child.key;

    }

  });


  if (foundUser) {

    roomId =
      [userId, foundUser]
      .sort()
      .join("_");


    await set(
      ref(db, "rooms/" + roomId),
      {
        user1: userId,
        user2: foundUser,
        createdAt: Date.now()
      }
    );


    await remove(
      ref(db, "waiting/" + foundUser)
    );


    await remove(
      ref(db, "waiting/" + userId)
    );


    showPartner(foundUser);

  }

  else {

    listenForMatch();

  }

}


/* FIND MATCH */

function listenForMatch() {

  onValue(
    ref(db, "waiting"),
    async snapshot => {

      let otherUser = null;


      snapshot.forEach(child => {

        if (
          child.key !== userId &&
          !otherUser
        ) {

          otherUser = child.key;

        }

      });


      if (!otherUser) {
        return;
      }


      roomId =
        [userId, otherUser]
        .sort()
        .join("_");


      await remove(
        ref(db, "waiting/" + userId)
      );

      await remove(
        ref(db, "waiting/" + otherUser)
      );


      await set(
        ref(db, "rooms/" + roomId),
        {
          user1: userId,
          user2: otherUser,
          createdAt: Date.now()
        }
      );


      showPartner(otherUser);

    }
  );

}


/* SHOW PARTNER */

async function showPartner(otherUser) {

  const snapshot =
    await get(
      ref(db, "profiles/" + otherUser)
    );


  if (snapshot.exists()) {

    const profile =
      snapshot.val();


    partnerProfile.innerHTML =
      `<strong>👋 ${escapeHtml(profile.name)}</strong>
       <br>
       ${escapeHtml(profile.gender)} • ${profile.age} years old`;

  }


  status.textContent =
    "🎉 You're connected!";


  listenForMessages();

}


/* MESSAGES */

function listenForMessages() {

  onValue(
    ref(db, "messages/" + roomId),
    snapshot => {

      messages.innerHTML = "";


      snapshot.forEach(child => {

        const data =
          child.val();


        const div =
          document.createElement("div");


        div.className =
          "message";


        if (data.sender === userId) {

          div.classList.add("mine");

        }


        div.textContent =
          data.text;


        messages.appendChild(div);

      });


      messages.scrollTop =
        messages.scrollHeight;

    }
  );

}


/* SEND MESSAGE */

async function sendMessage() {

  const text =
    messageInput.value.trim();


  if (!text || !roomId) {
    return;
  }


  await push(
    ref(db, "messages/" + roomId),
    {
      sender: userId,
      text: text,
      time: Date.now()
    }
  );


  messageInput.value = "";

}


/* NEXT */

async function nextPerson() {

  if (roomId) {

    await remove(
      ref(db, "messages/" + roomId)
    );

    await remove(
      ref(db, "rooms/" + roomId)
    );

  }


  roomId = null;

  messages.innerHTML = "";

  partnerProfile.innerHTML =
    "👤 Looking for someone new...";

  status.textContent =
    "🔎 Looking for someone...";


  await startMatching();

}


/* BASIC HTML ESCAPE */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
