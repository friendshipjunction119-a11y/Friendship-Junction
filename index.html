<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friendship Junction</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6c5ce7, #a855f7, #ec4899);
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      margin-top: 15px;
    }

    h1 {
      font-size: 34px;
      margin: 8px 0;
    }

    .subtitle {
      opacity: .85;
      margin-bottom: 20px;
    }

    .card {
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 25px;
      text-align: left;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .checkbox {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 18px 0;
      font-size: 14px;
      line-height: 1.4;
    }

    .checkbox input {
      width: auto;
      margin-top: 3px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #7c3aed;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .danger {
      background: #ffdddd;
      color: #c0392b;
    }

    .secondary {
      background: rgba(255,255,255,.25);
      color: white;
    }

    #chatArea {
      display: none;
    }

    #status {
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .profile {
      background: rgba(255,255,255,.18);
      padding: 12px;
      border-radius: 15px;
      margin-bottom: 15px;
      text-align: center;
    }

    #messages {
      height: 330px;
      overflow-y: auto;
      background: rgba(0,0,0,.15);
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .message {
      background: rgba(255,255,255,.18);
      padding: 10px;
      border-radius: 14px;
      margin: 6px 0;
      word-wrap: break-word;
    }

    .mine {
      background: white;
      color: #6c5ce7;
      text-align: right;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
    }

    .input-row button {
      width: auto;
      padding: 12px 18px;
    }

    .error {
      color: #ffe1e1;
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }

    .notice {
      font-size: 12px;
      opacity: .75;
      margin-top: 15px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">🤝</div>

  <h1>Friendship Junction</h1>

  <p class="subtitle">
    Meet someone new. Make a new friend.
  </p>


  <!-- PROFILE -->

  <div class="card" id="profileArea">

    <label>Your name</label>

    <input
      id="nameInput"
      type="text"
      maxlength="30"
      placeholder="Enter your name"
      autocomplete="off"
    >

    <label>Gender</label>

    <select id="genderInput">
      <option value="">Select gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <label>Age</label>

    <input
      id="ageInput"
      type="number"
      min="18"
      max="100"
      placeholder="18 or older"
    >

    <label class="checkbox">
      <input id="adultCheck" type="checkbox">
      <span>
        I confirm that I am 18 years old or older.
      </span>
    </label>

    <button id="startButton">
      🚀 Start Chat
    </button>

    <p id="error" class="error"></p>

    <p class="notice">
      Never share your phone number, address, password,
      financial information, or other private information
      with strangers.
    </p>

  </div>


  <!-- CHAT -->

  <div class="card" id="chatArea">

    <div id="status">
      Connecting...
    </div>

    <div class="profile" id="partnerProfile">
      👤 Looking for someone...
    </div>

    <div id="messages"></div>

    <div class="input-row">

      <input
        id="messageInput"
        type="text"
        maxlength="500"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button id="sendButton">
        Send
      </button>

    </div>

    <button id="nextButton">
      ⏭️ Next Person
    </button>

    <button id="reportButton" class="secondary">
      🚩 Report User
    </button>

    <button id="blockButton" class="danger">
      🚫 Block User
    </button>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  push,
  onValue,
  remove,
  onDisconnect
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey:
    "AIzaSyCjK69caLVFreSK40n3S-5OkWBQXMa_lyI",

  authDomain:
    "friendship-junction-549ff.firebaseapp.com",

  databaseURL:
    "https://friendship-junction-549ff-default-rtdb.firebaseio.com",

  projectId:
    "friendship-junction-549ff",

  storageBucket:
    "friendship-junction-549ff.firebasestorage.app",

  messagingSenderId:
    "641554247603",

  appId:
    "1:641554247603:web:69115118fe8bceb96265c6"
};


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* USER */

const userId =
  "user_" +
  Math.random().toString(36).substring(2, 10);


let roomId = null;
let myProfile = null;
let currentPartnerId = null;
let waitingListenerStarted = false;


/* ELEMENTS */

const nameInput =
  document.getElementById("nameInput");

const genderInput =
  document.getElementById("genderInput");

const ageInput =
  document.getElementById("ageInput");

const adultCheck =
  document.getElementById("adultCheck");

const startButton =
  document.getElementById("startButton");

const profileArea =
  document.getElementById("profileArea");

const chatArea =
  document.getElementById("chatArea");

const status =
  document.getElementById("status");

const partnerProfile =
  document.getElementById("partnerProfile");

const messages =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const nextButton =
  document.getElementById("nextButton");

const reportButton =
  document.getElementById("reportButton");

const blockButton =
  document.getElementById("blockButton");

const error =
  document.getElementById("error");


/* BUTTONS */

startButton.addEventListener(
  "click",
  startMatching
);

sendButton.addEventListener(
  "click",
  sendMessage
);

nextButton.addEventListener(
  "click",
  nextPerson
);

reportButton.addEventListener(
  "click",
  reportUser
);

blockButton.addEventListener(
  "click",
  blockUser
);


messageInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      sendMessage();
    }

  }
);


/* PROFILE VALIDATION */

function getProfile() {

  const name =
    nameInput.value.trim();

  const gender =
    genderInput.value;

  const age =
    Number(ageInput.value);


  if (!name) {

    error.textContent =
      "Please enter your name.";

    return null;
  }


  if (!gender) {

    error.textContent =
      "Please select your gender.";

    return null;
  }


  if (!Number.isInteger(age) || age < 18 || age > 100) {

    error.textContent =
      "You must be 18 or older.";

    return null;
  }


  if (!adultCheck.checked) {

    error.textContent =
      "You must confirm that you are 18+.";

    return null;
  }


  error.textContent = "";


  return {
    name: name,
    gender: gender,
    age: age
  };

}


/* START */

async function startMatching() {

  myProfile = getProfile();

  if (!myProfile) {
    return;
  }


  startButton.disabled = true;

  profileArea.style.display = "none";
  chatArea.style.display = "block";

  status.textContent =
    "🔎 Looking for someone...";


  await set(
    ref(db, "profiles/" + userId),
    myProfile
  );


  await set(
    ref(db, "waiting/" + userId),
    {
      joinedAt: Date.now()
    }
  );


  onDisconnect(
    ref(db, "waiting/" + userId)
  ).remove();


  await findMatch();

}


/* FIND MATCH */

async function findMatch() {

  const snapshot =
    await get(ref(db, "waiting"));


  let foundUser = null;


  snapshot.forEach(child => {

    if (
      child.key !== userId &&
      !foundUser
    ) {

      foundUser = child.key;

    }

  });


  if (foundUser) {

    await createRoom(foundUser);

  } else {

    listenForWaitingUsers();

  }

}


/* LISTEN FOR NEW USERS */

function listenForWaitingUsers() {

  if (waitingListenerStarted) {
    return;
  }

  waitingListenerStarted = true;


  onValue(
    ref(db, "waiting"),
    snapshot => {

      let otherUser = null;


      snapshot.forEach(child => {

        if (
          child.key !== userId &&
          !otherUser
        ) {

          otherUser = child.key;

        }

      });


      if (otherUser && !roomId) {

        createRoom(otherUser);

      }

    }
  );

}


/* CREATE ROOM */

async function createRoom(otherUser) {

  const alreadyBlocked =
    await get(
      ref(
        db,
        "blocks/" +
        userId +
        "/" +
        otherUser
      )
    );


  if (alreadyBlocked.exists()) {

    await remove(
      ref(
        db,
        "waiting/" +
        otherUser
      )
    );

    return;

  }


  roomId =
    [userId, otherUser]
    .sort()
    .join("_");


  currentPartnerId =
    otherUser;


  await set(
    ref(db, "rooms/" + roomId),
    {
      user1: userId,
      user2: otherUser,
      createdAt: Date.now()
    }
  );


  await remove(
    ref(db, "waiting/" + userId)
  );


  await remove(
    ref(db, "waiting/" + otherUser)
  );


  await showPartner(otherUser);

}


/* SHOW PARTNER */

async function showPartner(otherUser) {

  const snapshot =
    await get(
      ref(
        db,
        "profiles/" +
        otherUser
      )
    );


  if (snapshot.exists()) {

    const profile =
      snapshot.val();


    partnerProfile.textContent =
      "👋 " +
      profile.name +
      " • " +
      profile.gender +
      " • " +
      profile.age +
      " years old";

  }


  status.textContent =
    "🎉 You're connected!";


  listenForMessages();

}


/* CHAT */

function listenForMessages() {

  onValue(
    ref(
      db,
      "messages/" +
      roomId
    ),
    snapshot => {

      messages.innerHTML = "";


      snapshot.forEach(child => {

        const data =
          child.val();


        const div =
          document.createElement("div");


        div.className =
          "message";


        if (data.sender === userId) {

          div.classList.add("mine");

        }


        div.textContent =
          data.text;


        messages.appendChild(div);

      });


      messages.scrollTop =
        messages.scrollHeight;

    }
  );

}


/* SEND */

async function sendMessage() {

  const text =
    messageInput.value.trim();


  if (!text || !roomId) {
    return;
  }


  await push(
    ref(
      db,
      "messages/" +
      roomId
    ),
    {
      sender: userId,
      text: text,
      time: Date.now()
    }
  );


  messageInput.value = "";

}


/* NEXT */

async function nextPerson() {

  if (roomId) {

    await remove(
      ref(
        db,
        "messages/" +
        roomId
      )
    );


    await remove(
      ref(
        db,
        "rooms/" +
        roomId
      )
    );

  }


  roomId = null;
  currentPartnerId = null;


  messages.innerHTML = "";

  partnerProfile.textContent =
    "👤 Looking for someone...";


  status.textContent =
    "🔎 Looking for someone...";


  await set(
    ref(
      db,
      "waiting/" +
      userId
    ),
    {
      joinedAt: Date.now()
    }
  );


  await findMatch();

}


/* REPORT */

async function reportUser() {

  if (!currentPartnerId || !roomId) {

    alert("You are not connected to anyone.");

    return;
  }


  const reason =
    prompt(
      "Report reason:\n\n" +
      "1. Harassment\n" +
      "2. Sexual content\n" +
      "3. Spam or bot\n" +
      "4. Fake profile\n" +
      "5. Other\n\n" +
      "Enter 1-5:"
    );


  if (!reason) {
    return;
  }


  const reasons = {

    "1": "Harassment",
    "2": "Sexual content",
    "3": "Spam or bot",
    "4": "Fake profile",
    "5": "Other"

  };


  if (!reasons[reason]) {

    alert("Invalid report reason.");

    return;
  }


  await push(
    ref(db, "reports"),
    {

      reporter:
        userId,

      reportedUser:
        currentPartnerId,

      roomId:
        roomId,

      reason:
        reasons[reason],

      createdAt:
        Date.now()

    }
  );


  alert(
    "Report submitted. Thank you."
  );

}


/* BLOCK */

async function blockUser() {

  if (!currentPartnerId) {

    alert(
      "You are not connected to anyone."
    );

    return;
  }


  const confirmed =
    confirm(
      "Block this user?\n\n" +
      "You will not be matched with this user again."
    );


  if (!confirmed) {
    return;
  }


  await set(
    ref(
      db,
      "blocks/" +
      userId +
      "/" +
      currentPartnerId
    ),
    {
      blockedAt:
        Date.now()
    }
  );


  alert("User blocked.");


  await nextPerson();

}

</script>

</body>
      </html>
